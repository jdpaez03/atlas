id: market-studies
name: MERCATO
title: Market Studies
description: Bank-grade market studies for vertical housing in Mexico — demand funnel, competing supply, absorption, price ladder, product mix, stress scenarios and a go / no-go with conditions.
color: "#2dd4bf"
kind: external
adapter: claude_md
adapter_config:
  # Prompt = the user's "estudio-mercado-vivienda-vertical" skill, kept locally (never in this repo)
  path: ${ATLAS_LOCAL_DIR}/agents/market-studies.md
nodes: [corporate]
capabilities: [market_study, absorption, pricing, product_mix, demand_analysis, bank_underwriting]
# Dedicated browser (docs/BROWSER.md): its own signed-in profile, never your everyday Chrome.
# The site stays in your .env; sign in once with `uv run atlas-browser login market-studies`.
browser:
  profile: mercato
  start_url: ${ATLAS_MERCATO_BROWSER_URL}
  allowed_domains: ["${ATLAS_MERCATO_BROWSER_DOMAINS}"]
  max_turns: 40
