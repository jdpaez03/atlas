id: argos
name: ARGOS
title: Monitor
description: Watches sources, processes and events; detects changes, anomalies and inconsistencies and alerts ATLAS.
color: "#fbbf24"
adapter: claude
capabilities: [monitoring, change_detection, anomaly_detection, consistency_checks]
