name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - run: uv run ruff check .
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - name: Contracts are in sync
        run: |
          cd apps/api && uv sync && uv run python ../../scripts/export_schema.py
          cd ../web && npm run gen:types
          git diff --exit-code -- ../../contracts lib/contracts.ts
      - run: npm run typecheck && npm run build
        working-directory: apps/web
