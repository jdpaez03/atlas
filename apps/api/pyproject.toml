[project]
name = "atlas-api"
version = "0.0.1"
description = "ATLAS — Multi-Agent AI Command Center (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "claude-agent-sdk>=0.2.159",
  "pypdf>=6.19.0",
  "openpyxl>=3.1.5",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "python-multipart>=0.0.32",
  "pdfplumber>=0.11.10",
  "msal>=1.39.0",
  "msal-extensions>=1.3.1",
  "extract-msg>=0.56.1",
  "httpx>=0.28.1",
  "tzdata>=2026.4",
  "ruamel-yaml>=0.19.1",
  "playwright>=1.56",
  "reportlab>=4.2",
]

[project.scripts]
atlas-browser = "atlas.live.browser:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
